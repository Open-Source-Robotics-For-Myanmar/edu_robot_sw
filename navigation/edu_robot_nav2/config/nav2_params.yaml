bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.8   # lidar_link TF timestamp tolerance (Wi-Fi delay fix)
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.32
      #footprint: "[[0.325,0.265],[0.325,-0.265],[-0.325,-0.265],[-0.325,0.265]]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /edu_robot/scan
          sensor_frame: "lidar_link"  # matched to URDF (was "laser" → frame not found)
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.8   # lidar_link TF timestamp tolerance (Wi-Fi delay fix)
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.32
      #footprint: "[[0.325,0.265],[0.325,-0.265],[-0.325,-0.265],[-0.325,0.265]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan line_obstacles
        scan:
          topic: /edu_robot/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        line_obstacles:
          topic: /edu_robot/line_obstacles
          sensor_frame: "lidar_link"  # matched to URDF (was "laser" → frame not found)
          data_type: "PointCloud2"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.5
      always_send_full_costmap: True

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    scale_velocities: false
    max_velocity: [0.4, 0.0, 0.4]
    min_velocity: [-0.4, 0.0, -0.4]
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-1.0, 0.0, -3.0]
    odom_topic: "/edu_robot/odom"
    velocity_timeout: 1.0


collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]
    PolygonStop:
      type: "polygon"
      points: [0.45, 0.45, 0.45, -0.45, -0.0, -0.45, -0.0, 0.45]
      action_type: "stop"
      min_points: 3  # max_points: 3 for Humble
      visualize: True
      polygon_pub_topic: "polygon_stop"
    PolygonSlow:
      type: "polygon"
      points: [0.6, 0.6, 0.6, -0.6, -0.0, -0.6, -0.0, 0.6]
      action_type: "slowdown"
      min_points: 3  # max_points: 3 for Humble
      slowdown_ratio: 0.6
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/edu_robot/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.02
      min_points: 5  # max_points: 5 for Humble
      visualize: False
    observation_sources: ["scan"]
    # observation_sources: ["scan", "pointcloud"]
    scan:
      type: "scan"
      topic: "/edu_robot/scan"
    # pointcloud:
    #   type: "pointcloud"
    #   topic: "/intel_realsense_r200_depth/points"
    #   min_height: 0.1
    #   max_height: 0.5

# ADD BY ROM DYNAMICS
smoother_server:
  ros__parameters:
    use_sim_time: false
    # Smoother Server အတွက် Plugin အမှန်ကို သတ်မှတ်ပေးခြင်း (ဥပမာ- SimpleSmoother)
    smoother_plugins: ["simple_smoother"] 
    
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother" # Humble ရဲ့ standard global path smoother plugin
      tolerance: 1.0e-10
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3

    # IPC ကြောင့် Crash မဖြစ်စေရန် ထည့်သွင်းထားသော QoS Override
    qos_overrides:
      /parameter_events:
        publisher:
          durability: volatile
        subscriber:
          durability: volatile
