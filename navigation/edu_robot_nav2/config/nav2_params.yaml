amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "/edu_robot/scan"
    laser_model_type: "likelihood_field"
    z_hit: 0.8
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.1
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0
    update_min_a: 0.2
    update_min_d: 0.25
    transform_tolerance: 1.0
    resample_interval: 1
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    tf_broadcast: false
    set_initial_pose: false
    save_pose_rate: 0.5

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/edu_robot/data/maps/active_map.yaml"

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 40.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.5
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    controller_patience: 3600.0
    
    # Plugins သတ်မှတ်ခြင်း (Humble Standard)
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress Checker: ရိုဘော့ ရှေ့မတိုးဘဲ ပိတ်မိနေလား စစ်ဆေးရန်
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal Checker: Waypoint ရောက်/မရောက် စစ်ဆေးရန် တန်ဖိုးများ
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15      # Position Tolerance (၁၅ စင်တီမီတာ စည်းဝိုင်းထဲရောက်ရင် ရောက်ပြီဟု သတ်မှတ်)
      yaw_goal_tolerance: 0.08     # Heading Tolerance (၄.၅ ဒီဂရီဝန်းကျင် ကွက်တိလှည့်ရန်)

    # Regulated Pure Pursuit Controller Configuration
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5        # ရိုဘော့မောင်းမယ့် အမြင့်ဆုံး linear velocity (m/s)
      lookahead_dist: 0.6            # ရှေ့ကြည့်မည့် အကွာအဝေး (0.5m မှ 0.9m ကြားသည် Differential အတွက် အကောင်းဆုံးဖြစ်)
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6 # နေရာမှာတင် ဗဟိုပြုလှည့်မယ့် အမြင့်ဆုံး အမြန်နှုန်း (rad/s)
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      
      # ဉာဏ်ရည်ပါသော အရှိန်လျှော့ချမှုစနစ်များ (Regulated Linear Velocity Scaling)
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9  # ကွေ့ကောက်သည့်နေရာများတွင် အရှိန်လျှော့ရန် ရေဒီယိုအကျယ်
      regulated_linear_scaling_min_speed: 0.1   # ကွေ့နေစဉ် လျှော့ချမည့် အနိမ့်ဆုံးအရှိန် (m/s)
      
      # Costmap အနီးအနားရောက်လျှင် အလိုအလျောက် အရှိန်လျှော့မည့်စနစ်
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      
      # အရေးပေါ် အတားအဆီး ဝင်တိုက်ခြင်းမှ ကာကွယ်ရန်စနစ် (Collision Detection)
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_allowed_linear_velocity: 1.0
      
      # နေရာမှာတင် အရင်လှည့်ပြီးမှ မောင်းနှင်မည့်စနစ် (Rotate to Heading)
      # ဤအပိုင်းသည် Waypoint အား Parking ကွေးမဝင်စေဘဲ Position အရင်သွားပြီးမှ Heading လှည့်ရန် ဖြစ်သည်
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785  # ၄၅ ဒီဂရီထက် လမ်းကြောင်းလွဲနေပါက ရှေ့မတိုးဘဲ အရင်လှည့်မည်
      max_angular_accel: 2.0              # Angular acceleration limit (rad/s^2)

